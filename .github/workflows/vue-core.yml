name: vue-core
run-name: "vue-core | ${{ inputs.runner }} | ${{ inputs.tag }}"

# One job, the same steps on every runner. The harness picks the runner label
# and the branch; Actions caches are scoped to the branch, so a new branch is a
# cold cache. See README.md for the method.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label to run on
        required: true
        default: ubuntu-latest
      tag:
        description: Free text the harness uses to find this run
        required: false
        default: manual

permissions:
  contents: read

env:
  PROJECT_REPO: vuejs/core
  PROJECT_REF: cbd95955a5362b44060908f6e28ad447c3031b8a

jobs:
  bench:
    name: bench
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Runner info
        run: |
          echo "bench-info nproc=$(nproc)"
          echo "bench-info mem_kb=$(grep MemTotal /proc/meminfo | tr -s ' ' | cut -d' ' -f2)"
          echo "bench-info cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)"
          echo "bench-info kernel=$(uname -r)"
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PROJECT_REPO }}
          ref: ${{ env.PROJECT_REF }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - name: Build
        run: pnpm run build
      - name: Unit tests
        run: pnpm run test-unit
