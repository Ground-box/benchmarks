name: voting-app-docker
run-name: "voting-app-docker | ${{ inputs.runner }} | ${{ inputs.tag }}"

# One job, the same steps on every runner. The harness picks the runner label
# and the branch; Actions caches are scoped to the branch, so a new branch is a
# cold cache. See README.md for the method.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label to run on
        required: true
        default: ubuntu-latest
      tag:
        description: Free text the harness uses to find this run
        required: false
        default: manual

permissions:
  contents: read

env:
  PROJECT_REPO: dockersamples/example-voting-app
  PROJECT_REF: 63e9150ca17af4ed05880d4245e486481f73fcb4

jobs:
  bench:
    name: bench
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Runner info
        run: |
          echo "bench-info nproc=$(nproc)"
          echo "bench-info mem_kb=$(grep MemTotal /proc/meminfo | tr -s ' ' | cut -d' ' -f2)"
          echo "bench-info cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)"
          echo "bench-info kernel=$(uname -r)"
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PROJECT_REPO }}
          ref: ${{ env.PROJECT_REF }}
          persist-credentials: false
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build vote image
        uses: docker/build-push-action@v7
        with:
          context: vote
          push: false
          cache-from: type=gha,scope=vote
          cache-to: type=gha,mode=max,scope=vote
      - name: Build result image
        uses: docker/build-push-action@v7
        with:
          context: result
          push: false
          cache-from: type=gha,scope=result
          cache-to: type=gha,mode=max,scope=result
      - name: Build worker image
        uses: docker/build-push-action@v7
        with:
          context: worker
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
