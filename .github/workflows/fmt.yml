name: fmt
run-name: "fmt | ${{ inputs.runner }} | ${{ inputs.tag }}"

# One job, the same steps on every runner. The harness picks the runner label
# and the branch; Actions caches are scoped to the branch, so a new branch is a
# cold cache. See README.md for the method.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label to run on
        required: true
        default: ubuntu-latest
      tag:
        description: Free text the harness uses to find this run
        required: false
        default: manual

permissions:
  contents: read

env:
  PROJECT_REPO: fmtlib/fmt
  PROJECT_REF: 14ac0d5a9d40aef14f50954069c1e10971abb0b2

jobs:
  bench:
    name: bench
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Runner info
        run: |
          echo "bench-info nproc=$(nproc)"
          echo "bench-info mem_kb=$(grep MemTotal /proc/meminfo | tr -s ' ' | cut -d' ' -f2)"
          echo "bench-info cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)"
          echo "bench-info kernel=$(uname -r)"
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PROJECT_REPO }}
          ref: ${{ env.PROJECT_REF }}
          persist-credentials: false
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build --parallel "$(nproc)"
      - name: Tests
        run: ctest --test-dir build --output-on-failure
