name: pytest
run-name: "pytest | ${{ inputs.runner }} | ${{ inputs.tag }}"

# One job, the same steps on every runner. The harness picks the runner label
# and the branch; Actions caches are scoped to the branch, so a new branch is a
# cold cache. See README.md for the method.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label to run on
        required: true
        default: ubuntu-latest
      tag:
        description: Free text the harness uses to find this run
        required: false
        default: manual

permissions:
  contents: read

env:
  PROJECT_REPO: pytest-dev/pytest
  PROJECT_REF: 50234b4e670064c42a4c29cb6258115a2079ba4c

jobs:
  bench:
    name: bench
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Runner info
        run: |
          echo "bench-info nproc=$(nproc)"
          echo "bench-info mem_kb=$(grep MemTotal /proc/meminfo | tr -s ' ' | cut -d' ' -f2)"
          echo "bench-info cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)"
          echo "bench-info kernel=$(uname -r)"
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          repository: ${{ env.PROJECT_REPO }}
          ref: ${{ env.PROJECT_REF }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -n auto testing
